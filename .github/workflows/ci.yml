name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest normal run (a cold Windows build) took about 35 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        # A mirror or DNS failure must fail the job fast, not hold the runner.
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS -qq update
          sudo apt-get $APT_OPTS install -y libxkbcommon-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: steam-asset-manager-${{ matrix.os }}
          path: |
            target/release/steam-asset-manager
            target/release/steam-asset-manager.exe
          if-no-files-found: error
