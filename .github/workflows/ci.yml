name: CI

on:
  # A tag push runs the Release workflow, which calls this workflow; a second run is not needed.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest normal run (a cold Windows build) took about 35 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        # The action has no release tags; the toolchain input picks stable.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        # A mirror or DNS failure must fail the job fast, not hold the runner.
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS -qq update
          sudo apt-get $APT_OPTS install -y libxkbcommon-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Test the release scripts
        if: matrix.os == 'ubuntu-latest'
        run: python3 -I -m unittest discover -s bin/tests

      - name: Build release
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steam-asset-manager-${{ matrix.os }}
          path: |
            target/release/steam-asset-manager
            target/release/steam-asset-manager.exe
          if-no-files-found: error
