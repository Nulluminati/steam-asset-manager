[package]
name = "steam-asset-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crc32fast = "1.5.4"
directories = "6.0.0"
iced = { version = "0.14.0", features = ["image", "tokio"] }
image = "0.25.10"
keyring = "4.2.0"
keyvalues-parser = "0.2.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
wiremock = "0.6.5"
